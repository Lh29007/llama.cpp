name: build-armv7

# Build ARMv7 (armeabi-v7a, 32 bits) binaries of llama.cpp with the Android NDK.
# Never build AArch64 here.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Variantes a compiler"
        type: choice
        options:
          - all
          - minimal
          - neon
        default: all
  push:
    branches:
      - armv7-build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  NDK_VERSION: "27.2.12479018"
  ANDROID_ABI: armeabi-v7a
  ANDROID_PLATFORM: android-24
  TARGETS: "llama-cli llama-server llama-bench llama-quantize"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
    steps:
      - id: plan
        name: Choisir les variantes
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VARIANTS: ${{ inputs.variants }}
        run: |
          case "$EVENT" in
            push) v='["minimal"]' ;;
            *)
              case "$INPUT_VARIANTS" in
                minimal) v='["minimal"]' ;;
                neon)    v='["neon"]' ;;
                *)       v='["minimal","neon"]' ;;
              esac
              ;;
          esac
          echo "Variantes retenues : $v"
          echo "variants=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}

    steps:
      - name: Cloner le depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 1. Verification de l'environnement
        run: |
          uname -a
          nproc
          free -h
          cmake --version
          ninja --version
          df -h /

      - name: Installer JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Installer Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      - name: 2. Configuration Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -E "clang$|llvm-readelf|llvm-strip" || true
          "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: 3. Verification de la cible ARMv7
        run: |
          echo "Valeurs par defaut du toolchain pour armeabi-v7a :"
          grep -n -i "armv7\|mfpu\|NEON\|mfloat-abi" "${ANDROID_NDK}/build/cmake/android.toolchain.cmake" | head -60

      - name: Definir les options de la variante
        id: variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          case "$VARIANT" in
            minimal)
              # Le toolchain NDK 27 refuse ANDROID_ARM_NEON=OFF : on retire NEON par le flag FPU.
              # Ce flag est place apres celui du toolchain, il est donc prioritaire.
              echo "cflags=-mfpu=vfpv3-d16" >> "$GITHUB_OUTPUT"
              echo "zip=llama.cpp-armv7-release.zip" >> "$GITHUB_OUTPUT"
              echo "description=Build A minimal CPU, sans NEON, sans OpenMP" >> "$GITHUB_OUTPUT"
              ;;
            neon)
              echo "cflags=-mfpu=neon-vfpv4" >> "$GITHUB_OUTPUT"
              echo "zip=llama.cpp-armv7-neon-experimental.zip" >> "$GITHUB_OUTPUT"
              echo "description=Build B CPU avec NEON (experimental)" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: 4. Configuration CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DCMAKE_C_FLAGS="${{ steps.variant.outputs.cflags }}" \
            -DCMAKE_CXX_FLAGS="${{ steps.variant.outputs.cflags }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_OPENCL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_FATAL_WARNINGS=OFF
          echo "Options de flottants generees :"
          grep -rhoE "mfpu=[^ ]+|march=[^ ]+|mfloat-abi=[^ ]+" build --include=flags.make | sort | uniq -c
          if [ "${{ matrix.variant }}" = "minimal" ] && grep -rq -- "-mfpu=neon" build --include=flags.make; then
            echo "ERREUR : la variante minimale contient encore -mfpu=neon"
            exit 1
          fi

      - name: 5. Compilation
        run: |
          # -k 0 : continue apres une cible en echec pour produire les autres executables.
          cmake --build build --config Release -- -k 0 2>&1 | tee build-output.log

      - name: Etat par cible
        if: always()
        run: |
          {
            echo "## Variante ${{ matrix.variant }} : ${{ steps.variant.outputs.description }}"
            echo ""
            echo "| Cible | Statut |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for t in $TARGETS; do
            bin=$(find build -type f -name "$t" -perm -u+x | head -1)
            if [ -n "$bin" ]; then
              echo "| $t | OK ($bin) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $t | ECHEC (non produit) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: 6. Verification ELF
        if: always()
        run: |
          READELF="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          chmod +x ci/armv7/verify-elf.sh
          status=0
          for t in $TARGETS; do
            bin=$(find build -type f -name "$t" -perm -u+x | head -1)
            if [ -z "$bin" ]; then
              echo "Cible absente : $t"
              status=1
              continue
            fi
            ci/armv7/verify-elf.sh "$bin" "$READELF" || status=1
          done
          exit $status

      - name: 7. Tests des executables
        if: always()
        run: |
          # Les binaires Android (bionic) ne se lancent pas sur le runner Ubuntu.
          # Le test de lancement reel se fait dans Termux : voir README-TERMUX.md et termux-test.sh.
          echo "Test de lancement reel non execute sur le runner (bionic/Android)." | tee -a build-output.log

      - name: 8. Archivage des resultats
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
          ZIP_NAME: ${{ steps.variant.outputs.zip }}
          DESCRIPTION: ${{ steps.variant.outputs.description }}
        run: |
          pkg="pkg/llama.cpp-armv7-${VARIANT}"
          mkdir -p "$pkg/bin"
          for t in $TARGETS; do
            bin=$(find build -type f -name "$t" -perm -u+x | head -1)
            [ -n "$bin" ] && cp "$bin" "$pkg/bin/$t"
          done
          cp ci/armv7/README-TERMUX.md ci/armv7/termux-test.sh "$pkg/"
          {
            echo "variant=${VARIANT}"
            echo "description=${DESCRIPTION}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "ndk=${NDK_VERSION}"
            echo "abi=${ANDROID_ABI}"
            echo "platform=${ANDROID_PLATFORM}"
            echo "cmake=$(cmake --version | head -1)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$pkg/build-info.txt"
          READELF="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          : > "$pkg/dependencies.txt"
          for f in "$pkg"/bin/*; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f")" >> "$pkg/dependencies.txt"
            "$READELF" -d "$f" | grep NEEDED >> "$pkg/dependencies.txt" || true
          done
          cp build-output.log "$pkg/build-log.txt"
          (cd "$pkg" && find bin -type f -exec sha256sum {} \; > SHA256SUMS)
          if [ -n "$(ls -A "$pkg/bin")" ]; then
            (cd pkg && zip -r "../${ZIP_NAME}" "llama.cpp-armv7-${VARIANT}")
          fi
          ls -la pkg "$pkg" "$pkg/bin" || true

      - name: Publier les artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armv7-${{ matrix.variant }}
          path: |
            ${{ steps.variant.outputs.zip }}
            build-output.log
          if-no-files-found: warn
          retention-days: 14
